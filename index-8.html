<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ICT MCQ Exam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f2f4f3;--sf:#fff;--fg:#15201d;--mu:#5a6b66;--ln:#d6dedb;--ac:#27408b;--acf:#fff;--acs:#e3e9f8;--ok:#1b7a4a;--oks:#dff2e7;--bad:#b3261e;--bads:#fbe4e1;--warn:#b26a00}
@media(prefers-color-scheme:dark){:root{--bg:#0f1514;--sf:#18211f;--fg:#e6eeeb;--mu:#9db0aa;--ln:#2b3835;--ac:#8fa8f2;--acf:#0d1330;--acs:#222c52;--ok:#5fd18f;--oks:#173528;--bad:#ff8a80;--bads:#3a1d1a;--warn:#f0b04a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.65 "Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;padding:0 max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left))}
.wrap{max-width:680px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2{margin:0}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(10px,env(safe-area-inset-top)) 0 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.timer{font:700 22px/1 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;padding:8px 12px;border-radius:10px;background:var(--sf);border:1px solid var(--ln)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.cnt{color:var(--mu);font-size:15px}
.btn{border:1.5px solid var(--ln);background:var(--sf);border-radius:10px;min-height:48px;padding:0 16px;font-weight:600}
.btn.main{background:var(--ac);border-color:var(--ac);color:var(--acf)}
.btn.sub{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;margin-top:6px}
.qn{font-size:14px;color:var(--mu);font-weight:600}
.q{font-size:19px;line-height:1.6;font-weight:500;margin:0;white-space:pre-line;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--ln);background:var(--bg);border-radius:10px;padding:12px 14px;min-height:48px;overflow-wrap:anywhere}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--mu);display:grid;place-items:center;font-size:13px;color:var(--mu)}
.opt.sel{background:var(--acs);border-color:var(--ac)}
.opt.sel .k{background:var(--ac);border-color:var(--ac);color:var(--acf)}
.nav{display:flex;gap:10px}
.nav .btn{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:14px}
.dot{aspect-ratio:1;border:1px solid var(--ln);background:var(--sf);border-radius:8px;font:600 13px ui-monospace,Menlo,monospace;padding:0}
.dot.a{background:var(--acs);border-color:var(--ac);color:var(--ac)}
.dot.c{outline:2px solid var(--ac);outline-offset:1px}
.center{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.center h1{font-size:30px}
.center .btn{min-width:200px}
.score{font:700 52px/1 ui-monospace,Menlo,monospace}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{border-radius:10px;padding:10px 4px;font-weight:600}
.stats b{display:block;font-size:24px;font-family:ui-monospace,Menlo,monospace}
.s-ok{background:var(--oks);color:var(--ok)}.s-bad{background:var(--bads);color:var(--bad)}.s-sk{background:var(--acs);color:var(--ac)}
.wr{border:1px solid var(--ln);border-radius:12px;padding:14px;margin-top:10px;background:var(--sf)}
.wr .q{font-size:17px}
.ln{display:flex;gap:8px;margin-top:8px;padding:8px 10px;border-radius:8px;overflow-wrap:anywhere}
.ln.y{background:var(--bads);color:var(--bad)}.ln.r{background:var(--oks);color:var(--ok)}.ln.s{background:var(--acs);color:var(--ac)}
.ln span:first-child{flex:none;font-weight:700}
h2{font-size:20px;margin:20px 0 4px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px}
.mbox{background:var(--sf);border-radius:14px;padding:20px 16px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.mbox p{margin:0;font-size:17px;font-weight:500}
</style>
</head>

    let keys=Object.keys(pools).filter(k=>pools[k].length);
    let cand=keys.filter(k=>+k!==last);
    if(!cand.length)cand=keys;
    const wsum=cand.reduce((s,k)=>s+pools[k].length,0);
    let x=Math.random()*wsum,pick=cand[0];
    for(const k of cand){x-=pools[k].length;if(x<=0){pick=k;break}}
    out.push(pools[pick].pop());last=+pick;
  }
  return out;
}
function newExam(){
  const perm={};
  R.forEach((r,i)=>perm[i]=r[3]?[0,1,2,3]:sh([0,1,2,3]));
  return{order:mixOrder(),perm,ans:{},cur:0,end:0,done:false,started:false};
}
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
if(!S||!S.order||S.order.length!==TOTAL)S=newExam();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

let tick=null;
function fmt(ms){ms=Math.max(0,ms);const s=Math.ceil(ms/1000),m=Math.floor(s/60),r=s%60;return bn(String(m).padStart(2,"0"))+":"+bn(String(r).padStart(2,"0"))}
function startTimer(){
  clearInterval(tick);
  const upd=()=>{
    const left=S.end-Date.now();
    const el=$("tm");
    if(el){el.textContent=fmt(left);el.classList.toggle("low",left<=5*60*1000)}
    if(left<=0){clearInterval(tick);submit()}
  };
  upd();tick=setInterval(upd,500);
}

function home(){
  app.innerHTML=`<div class="center"><h1>ICT MCQ Exam</h1><button class="btn main" id="go">শুরু করো</button></div>`;
  $("go").onclick=()=>{S=newExam();S.started=true;S.end=Date.now()+DUR;save();exam()};
}
function exam(){
  if(!S.started){home();return}
  if(S.done){result();return}
  const qi=S.order[S.cur],r=R[qi],p=S.perm[qi],a=S.ans[qi];
  const answered=Object.keys(S.ans).length;
  const opts=p.map((oi,i)=>`<button type="button" class="opt ${a===oi?"sel":""}" data-o="${oi}"><span class="k">${KS[i]}</span><span>${r[2][oi]}</span></button>`).join("");
  const dots=S.order.map((q,i)=>`<button type="button" class="dot ${S.ans[q]!==undefined?"a":""} ${i===S.cur?"c":""}" data-j="${i}">${bn(i+1)}</button>`).join("");
  const last=S.cur===TOTAL-1;
  app.innerHTML=`<div class="top"><span class="timer" id="tm">${fmt(S.end-Date.now())}</span><span class="cnt">${bn(answered)}/${bn(TOTAL)}</span><button class="btn sub" id="sub" type="button">সাবমিট</button></div>
  <div class="card"><div class="qn">প্রশ্ন ${bn(S.cur+1)}/${bn(TOTAL)}</div><p class="q">${r[1]}</p><div class="opts">${opts}</div>
  <div class="nav"><button class="btn" id="prev" type="button" ${S.cur===0?"disabled":""}>আগের</button><button class="btn main" id="next" type="button" ${last?"disabled":""}>${a===undefined?"স্কিপ":"পরের"}</button></div></div>
  <div class="grid">${dots}</div>`;
  startTimer();
}
function go(j){S.cur=Math.min(TOTAL-1,Math.max(0,j));save();exam();window.scrollTo({top:0})}
function submit(){
  if(S.done)return;
  S.done=true;clearInterval(tick);save();result();window.scrollTo({top:0});
}
function result(){
  let ok=0,bad=0,sk=0;const wl=[];
  S.order.forEach((qi,i)=>{
    const a=S.ans[qi];
    if(a===undefined){sk++;wl.push([i,qi,a])}
    else if(a===cor(R[qi]))ok++;
    else{bad++;wl.push([i,qi,a])}
  });
  const items=wl.map(([i,qi,a])=>{
    const r=R[qi];
    return `<div class="wr"><div class="qn">প্রশ্ন ${bn(i+1)}</div><p class="q">${r[1]}</p>
    ${a===undefined?`<div class="ln s"><span>✗</span><span>উত্তর দেওয়া হয়নি</span></div>`:`<div class="ln y"><span>✗</span><span>তোমার উত্তর: ${r[2][a]}</span></div>`}
    <div class="ln r"><span>✓</span><span>সঠিক উত্তর: ${r[2][cor(r)]}</span></div></div>`;
  }).join("");
  app.innerHTML=`<div class="center" style="min-height:auto;padding-top:32px;gap:14px"><div class="score">${bn(ok)}/${bn(TOTAL)}</div>
  <div class="stats" style="width:100%"><div class="s-ok"><b>${bn(ok)}</b>সঠিক</div><div class="s-bad"><b>${bn(bad)}</b>ভুল</div><div class="s-sk"><b>${bn(sk)}</b>স্কিপ</div></div></div>
  ${wl.length?`<h2>ভুল ও স্কিপ</h2>${items}`:""}
  <div class="nav" style="margin-top:20px"><button class="btn main" id="again" type="button">আবার পরীক্ষা দাও</button></div>`;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.o!==undefined){
    const qi=S.order[S.cur],v=+t.dataset.o;
    if(S.ans[qi]===v)delete S.ans[qi];else S.ans[qi]=v;
    save();exam();return;
  }
  if(t.dataset.j!==undefined){go(+t.dataset.j);return}
  if(t.id==="prev"){go(S.cur-1);return}
  if(t.id==="next"){go(S.cur+1);return}
  if(t.id==="sub"){
    const left=TOTAL-Object.keys(S.ans).length;
    const m=document.createElement("div");
    m.className="modal";m.id="modal";
    m.innerHTML=`<div class="mbox"><p>${left?`${bn(left)}টি প্রশ্নের উত্তর দেওয়া হয়নি। সাবমিট করবে?`:"সাবমিট করবে?"}</p><div class="nav"><button class="btn" id="mno" type="button">না</button><button class="btn sub" id="myes" type="button">সাবমিট</button></div></div>`;
    document.body.appendChild(m);
    return;
  }
  if(t.id==="mno"){const m=$("modal");if(m)m.remove();return}
  if(t.id==="myes"){const m=$("modal");if(m)m.remove();submit();return}
  if(t.id==="again"){S=newExam();save();home()}
});
if(S.started&&!S.done){if(Date.now()>=S.end){S.done=true;save();result()}else exam()}
else if(S.done)result();
else home();
</script>
</body>
